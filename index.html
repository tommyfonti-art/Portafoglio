<!DOCTYPE html>
<html lang="it">
<head>
<meta name="versione-app" content="2026-11-27a">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portafoglio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<title>Portafoglio</title>
</head>
<body>
<div id="accesso" class="schermo nascosto">
  <form class="scheda accesso" id="acc-form" autocomplete="on">
    <h1>Portafoglio</h1>
    <p class="tenue" id="acc-sotto">Accedi per vedere i tuoi dati</p>
    <input id="acc-mail" name="email" type="email" inputmode="email" placeholder="Indirizzo di posta" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <span class="pw-box"><input id="acc-pw" name="password" type="password" placeholder="Parola d'ordine" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="occhio" data-occhio aria-label="Mostra la parola d'ordine"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    <span class="pw-box nascosto" id="acc-pw2-box"><input id="acc-pw2" name="password2" type="password" placeholder="Ripeti la parola d'ordine" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="occhio" data-occhio aria-label="Mostra la parola d'ordine"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span>
    <button type="submit" id="acc-entra" class="primario">Accedi</button>
    <button type="button" id="acc-crea" class="secondario">Crea un nuovo profilo</button>
    <button type="button" id="acc-reset" style="background:none;border:0;color:var(--accento);margin-top:12px;width:100%;font-size:15px">Hai dimenticato la parola d'ordine?</button>
    <p id="acc-errore" class="errore"></p>
  </form>
</div>

<div id="app" class="nascosto">
  <header>
    <h1 id="titolo">Riepilogo</h1>
    <div id="stato-salvataggio" class="tenue piccolo"></div>
  </header>
  <main id="contenuto"></main>
  <nav>
    <button data-vista="riepilogo" class="attivo"><span>◉</span>Riepilogo</button>
    <button data-vista="versamento"><span>＋</span>Versamento</button>
    <button data-vista="posizioni"><span>≡</span>Posizioni</button>
    <button data-vista="simulazione"><span>∿</span>Simulazione</button>
    <button data-vista="altro"><span>⋯</span>Altro</button>
  </nav>
</div>
<div id="avviso" class="avviso nascosto"></div>
<script type="module" src="app.js"></script>
<script>
/* Aggiornamento automatico: se su GitHub c'è una versione nuova dell'app, la ricarico da sola.
   Il numero di versione lo cambia GitHub a ogni pubblicazione (file .github/workflows/pubblica.yml). */
(function(){
  var mia = (document.querySelector('meta[name="versione-app"]') || {}).content;
  if (!mia || !window.fetch || location.protocol.indexOf('http') !== 0) return;
  var inCorso = false;
  function controlla(){
    if (inCorso || document.hidden) return;
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (window.portafoglioSalvataggio) return; // prima finisce di salvare
    inCorso = true;
    fetch(location.pathname + '?c=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : ''; })
      .then(function(t){
        inCorso = false;
        var m = t && t.match(/<meta name="versione-app" content="([^"]+)"/);
        if (!m || m[1] === mia) return;
        var chiave = 'agg_' + m[1];
        try { if (sessionStorage.getItem(chiave)) return; sessionStorage.setItem(chiave, '1'); } catch(e) {}
        location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
      })
      .catch(function(){ inCorso = false; });
  }
  setTimeout(controlla, 1500);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) setTimeout(controlla, 700); });
  setInterval(controlla, 300000);
})();
</script>
</body>
</html>
